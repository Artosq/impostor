<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--danger:#e74c3c;--secondary:#2ecc71}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#161616}
body{font-family:"Silkscreen",sans-serif;color:#eee;position:relative}
#grid{position:absolute;inset:-140px;
  background-image:linear-gradient(0deg,transparent 24%,rgba(255,255,255,.07) 25%,rgba(255,255,255,.07) 27%,transparent 28%,transparent 74%,rgba(255,255,255,.07) 75%,rgba(255,255,255,.07) 77%,transparent 78%,transparent),
  linear-gradient(90deg,transparent 24%,rgba(255,255,255,.07) 25%,rgba(255,255,255,.07) 27%,transparent 28%,transparent 74%,rgba(255,255,255,.07) 75%,rgba(255,255,255,.07) 77%,transparent 78%,transparent);
  background-size:70px 70px}
#glow{position:absolute;width:1400px;height:1400px;border-radius:50%;left:260px;top:-160px;filter:blur(40px)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%)}
.scene{position:absolute;inset:0;opacity:0}
.abs{position:absolute}
.crop{position:absolute;overflow:hidden;border-radius:22px;background:#1f1f1f;box-shadow:0 30px 70px rgba(0,0,0,.85)}
.crop img{position:absolute;left:0;display:block}
.h1{font-weight:700;font-size:84px;letter-spacing:10px;white-space:nowrap}
.h2{font-size:40px;letter-spacing:4px;white-space:nowrap}
.red{color:var(--danger);text-shadow:0 0 30px var(--danger)}
.green{color:var(--secondary);text-shadow:0 0 24px var(--secondary)}
.center{left:0;right:0;text-align:center}
.name{font-size:30px;letter-spacing:4px;color:#999;text-align:center;width:400px}
.side{font-size:62px;letter-spacing:6px}
#s2logo,#s6logo{filter:drop-shadow(0 0 40px rgba(255,255,255,.22))}
.tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:6px solid #fff;opacity:0;box-shadow:0 0 30px #fff}
</style></head><body>
<div id="grid"></div><div id="glow"></div>

<!-- S1 hook -->
<div class="scene" id="s1">
  <div class="abs h1 center" id="s1a" style="top:150px">WSZYSCY ZNAJĄ HASŁO.</div>
  <div class="abs h1 center red" id="s1b" style="top:150px">OPRÓCZ JEDNEGO.</div>
  <div id="s1cards"></div>
</div>

<!-- S2 reveal -->
<div class="scene" id="s2">
  <img class="abs" id="s2logo" src="../../public/logo4.png" style="width:860px;left:530px;top:170px">
  <div class="abs h2 center" id="s2t" style="top:700px;line-height:66px">Towarzyska gra w zgadywanie haseł<br><span class="red">i wykrywanie oszusta.</span></div>
</div>

<!-- S3 lobby -->
<div class="scene" id="s3">
  <div class="abs h1 side" id="s3a" style="left:170px;top:400px">STWÓRZ POKÓJ.</div>
  <div class="abs h2 green" id="s3b" style="left:174px;top:510px">Ekipa dołącza z telefonów.</div>
  <div class="crop" id="s3c" style="left:1150px;top:300px;width:600px;height:470px">
    <img src="shots/lobby1.png" style="width:600px"><img src="shots/lobby2.png" style="width:600px"><img src="shots/lobby3.png" style="width:600px"><img src="shots/lobby4.png" style="width:600px">
  </div>
</div>

<!-- S4 categories -->
<div class="scene" id="s4">
  <div class="abs h1 side" id="s4a" style="left:170px;top:400px">PONAD 1300 HASEŁ.</div>
  <div class="abs h2 green" id="s4b" style="left:174px;top:510px">Albo wpisz własne.</div>
  <div class="crop" id="s4p" style="left:1270px;top:90px;width:480px;height:900px"><img src="shots/picker.png" style="width:480px;top:0"></div>
  <div class="crop" id="s4e" style="left:1230px;top:230px;width:560px;height:620px">
    <img src="shots/editor1.png" style="width:560px;top:0"><img src="shots/editor2.png" style="width:560px;top:0"><img src="shots/editor3.png" style="width:560px;top:0"><img src="shots/editor4.png" style="width:560px;top:0">
  </div>
  <div class="tap" id="s4tap" style="left:1420px;top:832px"></div>
</div>

<!-- S5 vote -->
<div class="scene" id="s5">
  <div class="abs h1 side" id="s5a" style="left:170px;top:400px">GŁOSUJCIE.</div>
  <div class="abs h2 red" id="s5b" style="left:174px;top:510px">Kto blefuje?</div>
  <div class="abs h2 green" id="s5c" style="left:174px;top:510px">Impostor złapany.</div>
  <div class="crop" id="s5v" style="left:1180px;top:250px;width:560px;height:560px">
    <img src="shots/vote.png" style="width:560px;top:-272px"><img src="shots/vote-picked.png" style="width:560px;top:-272px">
  </div>
  <div class="crop" id="s5r" style="left:1180px;top:290px;width:560px;height:470px"><img src="shots/results.png" style="width:560px;top:-40px"></div>
  <div class="tap" id="s5tap" style="left:1338px;top:682px"></div>
</div>

<!-- S6 outro -->
<div class="scene" id="s6">
  <img class="abs" id="s6logo" src="../../public/logo4.png" style="width:760px;left:580px;top:150px">
  <div class="abs h1 center red" id="s6a" style="top:640px;font-size:110px">KTO KŁAMIE?</div>
  <div class="abs h2 center" id="s6b" style="top:810px">Zbierz ekipę. Znajdź impostora.</div>
</div>
<div id="vig"></div>

<script>
const $ = id => document.getElementById(id);
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => cl((t - a) / (b - a));
const oC = x => 1 - Math.pow(1 - x, 3);
const oB = x => { const c = 1.7, c3 = c + 1; return 1 + c3 * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const iC = x => x * x * x;

// S1 cards: crop source y 560..1600 of 1152-wide shots, scaled to 400px
const NAMES = ['Kasia', 'Tomek', 'Ola', 'Maciek'];
const ORDER = [0, 1, 3, 2];                       // reveal order; Ola (index 2) is the impostor, last
const REVEAL = [1.0, 1.5, 2.0, 2.5];
const SC = 400 / 1152, TOP = -560 * SC, H = 1040 * SC;
const cards = [];
NAMES.forEach((n, i) => {
  const x = 100 + i * 440;
  const wrap = document.createElement('div');
  wrap.className = 'abs'; wrap.style.cssText = `left:${x}px;top:350px;width:400px`;
  wrap.innerHTML = `<div class="crop" style="position:relative;width:400px;height:${H}px">
      <img src="shots/game${i}-hidden.png" style="width:400px;top:${TOP}px">
      <img class="shown" src="shots/game${i}-shown.png" style="width:400px;top:${TOP}px">
      <div class="flash" style="position:absolute;left:31px;right:31px;top:${(805 - 560) * SC}px;height:${770 * SC}px;border-radius:10px;background:#fff"></div>
    </div><div class="name" style="margin-top:26px">${n}</div>`;
  $('s1cards').append(wrap);
  cards.push({ wrap, shown: wrap.querySelector('.shown'), flash: wrap.querySelector('.flash'), crop: wrap.querySelector('.crop'), name: wrap.querySelector('.name') });
});

function sceneAlpha(t, a, b) { return Math.min(seg(t, a, a + 0.3), 1 - seg(t, b - 0.25, b)); }
function show(id, t, a, d = 0.4, dy = 30) {
  const p = oC(seg(t, a, a + d));
  $(id).style.opacity = p; $(id).style.transform = `translateY(${(1 - p) * dy}px)`;
}
function stack(imgs, t, times) {        // times[k] = moment image k replaces k-1
  imgs.forEach((im, k) => { im.style.opacity = k === 0 ? 1 : seg(t, times[k], times[k] + 0.12); });
}
function tap(id, t, at) {
  const p = seg(t, at - 0.15, at + 0.35);
  $(id).style.opacity = p > 0 && p < 1 ? (1 - p) : 0;
  $(id).style.transform = `scale(${0.4 + p * 0.9})`;
}
function bump(t, at) { const p = seg(t, at, at + 0.3); return 1 + Math.sin(p * Math.PI) * 0.03; }

window.render = function (t) {
  // background glow color follows the story
  const red = t >= 2.5 && t < 5 || t >= 14.5 && t < 16 || t >= 17.5;
  $('glow').style.background = `radial-gradient(circle, ${red ? 'rgba(231,76,60,.16)' : 'rgba(46,204,113,.10)'} 0%, transparent 60%)`;
  $('grid').style.transform = `translate(${(t * 14) % 70}px, ${(t * 9) % 70}px)`;

  // S1
  $('s1').style.opacity = sceneAlpha(t, -1, 5.0);
  $('s1').style.transform = `scale(${1 + t * 0.006})`;
  $('s1a').style.opacity = t < 2.5 ? oC(seg(t, 0.15, 0.5)) : 0;
  $('s1a').style.transform = `translateY(${(1 - oC(seg(t, 0.15, 0.5))) * 30}px)`;
  const sb = seg(t, 2.5, 2.75);
  $('s1b').style.opacity = t >= 2.5 ? 1 : 0;
  $('s1b').style.transform = `scale(${1.25 - 0.25 * oC(sb)})`;
  ORDER.forEach((ci, k) => {
    const c = cards[ci], r = REVEAL[k];
    const enter = oC(seg(t, 0.05 * ci, 0.05 * ci + 0.6));
    const isImp = ci === 2;
    const pop = isImp ? Math.sin(seg(t, r, r + 0.35) * Math.PI) * 0.09 : Math.sin(seg(t, r, r + 0.25) * Math.PI) * 0.04;
    const shake = isImp && t > r && t < r + 0.5 ? Math.sin(t * 90) * 10 * (1 - seg(t, r, r + 0.5)) : 0;
    c.wrap.style.transform = `translate(${shake}px, ${(1 - enter) * 160}px) scale(${1 + pop})`;
    c.wrap.style.opacity = enter;
    c.shown.style.opacity = t >= r ? 1 : 0;
    c.flash.style.opacity = t >= r ? 0.85 * (1 - seg(t, r, r + 0.3)) : 0;
    const dim = !isImp && t > 2.6 ? 1 - 0.55 * seg(t, 2.6, 3.0) : 1;
    c.crop.style.filter = `brightness(${dim})`;
    c.crop.style.boxShadow = isImp && t >= r ? `0 0 ${60 + 30 * Math.sin(t * 6)}px rgba(231,76,60,.7), 0 30px 70px rgba(0,0,0,.85)` : '';
    c.name.style.color = isImp && t >= r ? '#e74c3c' : '#999';
  });

  // S2
  $('s2').style.opacity = sceneAlpha(t, 5.0, 8.0);
  const lp = seg(t, 5.05, 5.65);
  $('s2logo').style.transform = `scale(${0.8 + 0.2 * oB(lp)}) translateY(${-6 * Math.sin(t * 2)}px)`;
  $('s2logo').style.opacity = oC(lp);
  show('s2t', t, 5.5);

  // S3
  $('s3').style.opacity = sceneAlpha(t, 8.0, 11.0);
  show('s3a', t, 8.05); show('s3b', t, 8.6);
  const c3 = oC(seg(t, 8.0, 8.5));
  $('s3c').style.transform = `translateX(${(1 - c3) * 300}px) rotate(${(1 - c3) * 6 - 1.5}deg) scale(${bump(t, 8.5) * bump(t, 9.0) * bump(t, 9.5)})`;
  const l3 = [...$('s3c').querySelectorAll('img')];
  l3.forEach(im => im.style.top = `${-540 * 600 / 1152}px`);
  stack(l3, t, [0, 8.5, 9.0, 9.5]);

  // S4
  $('s4').style.opacity = sceneAlpha(t, 11.0, 14.5);
  show('s4a', t, 11.05); show('s4b', t, 12.4);
  const pin = oC(seg(t, 11.0, 11.5)), pout = seg(t, 12.35, 12.6);
  $('s4p').style.opacity = 1 - pout;
  $('s4p').style.transform = `translateY(${(1 - pin) * 500}px) rotate(1.5deg) scale(${1 - pout * 0.08})`;
  const ein = oC(seg(t, 12.4, 12.75));
  $('s4e').style.opacity = ein;
  $('s4e').style.transform = `scale(${0.9 + 0.1 * ein}) rotate(-1.5deg)`;
  stack([...$('s4e').querySelectorAll('img')], t, [0, 13.0, 13.4, 13.8]);
  tap('s4tap', t, 12.2);

  // S5
  $('s5').style.opacity = sceneAlpha(t, 14.5, 17.5);
  show('s5a', t, 14.55);
  $('s5b').style.opacity = t < 15.95 ? oC(seg(t, 14.9, 15.2)) : 0;
  show('s5c', t, 16.1);
  const vin = oC(seg(t, 14.5, 15.0)), vout = seg(t, 15.9, 16.1);
  $('s5v').style.opacity = 1 - vout;
  $('s5v').style.transform = `translateX(${(1 - vin) * 300}px) rotate(1.5deg) scale(${bump(t, 15.5)})`;
  stack([...$('s5v').querySelectorAll('img')], t, [0, 15.5]);
  tap('s5tap', t, 15.5);
  const rin = seg(t, 16.0, 16.4);
  $('s5r').style.opacity = oC(rin);
  $('s5r').style.transform = `scale(${0.85 + 0.15 * oB(rin)}) rotate(-1.5deg)`;
  $('s5r').style.boxShadow = `0 0 ${50 + 20 * Math.sin(t * 5)}px rgba(46,204,113,${0.5 * rin}), 0 30px 70px rgba(0,0,0,.85)`;

  // S6
  $('s6').style.opacity = sceneAlpha(t, 17.5, 99);
  const op = seg(t, 17.55, 18.1);
  $('s6logo').style.opacity = oC(op);
  $('s6logo').style.transform = `scale(${0.85 + 0.15 * oB(op)}) translateY(${-6 * Math.sin(t * 2)}px)`;
  const kp = seg(t, 18.0, 18.25);
  $('s6a').style.opacity = t >= 18.0 ? 1 : 0;
  $('s6a').style.transform = `scale(${1.3 - 0.3 * oC(kp)})`;
  show('s6b', t, 18.6);
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
render(0);
</script></body></html>
