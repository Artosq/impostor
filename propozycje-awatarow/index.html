<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propozycje awatarów</title>
<style>
@font-face{font-family:"Silkscreen";font-weight:400;src:url("../public/fonts/silkscreen-400-latin.woff2") format("woff2")}
@font-face{font-family:"Silkscreen";font-weight:700;src:url("../public/fonts/silkscreen-700-latin.woff2") format("woff2")}
:root{--primary:#3498db;--secondary:#2ecc71;--danger:#e74c3c}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 60px;background:#161616;color:#eee;font-family:"Silkscreen",sans-serif;
  background-image:linear-gradient(0deg,transparent 24%,rgba(255,255,255,.06) 25%,rgba(255,255,255,.06) 27%,transparent 28%,transparent 74%,rgba(255,255,255,.06) 75%,rgba(255,255,255,.06) 77%,transparent 78%),
  linear-gradient(90deg,transparent 24%,rgba(255,255,255,.06) 25%,rgba(255,255,255,.06) 27%,transparent 28%,transparent 74%,rgba(255,255,255,.06) 75%,rgba(255,255,255,.06) 77%,transparent 78%);background-size:70px 70px}
header{max-width:1180px;margin:0 auto 22px}
h1{margin:0 0 8px;letter-spacing:6px;color:#fff}
.intro{color:#aaa;font-size:12px;line-height:1.7;letter-spacing:1px;max-width:900px}
.dir{max-width:1180px;margin:0 auto 30px;padding:26px;border-radius:15px;background:#1f1f1f;box-shadow:0 10px 25px rgba(0,0,0,1)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px}
h2{margin:0;font-size:26px;letter-spacing:4px;color:var(--secondary);text-shadow:0 0 20px var(--secondary)}
.tag{margin:6px 0 4px;color:#bbb;font-size:12px;letter-spacing:1px}
.meta{color:#777;font-size:11px;letter-spacing:1px;margin-bottom:14px}
button{font-family:"Silkscreen",sans-serif;font-weight:700;padding:10px 18px;border:5px solid var(--secondary);border-radius:5px;background:transparent;color:var(--secondary);cursor:pointer;transition:.4s}
button:hover{background:var(--secondary);color:#fff;box-shadow:0 0 20px var(--secondary)}
.label{margin:18px 0 8px;color:#999;font-size:12px;letter-spacing:2px}
.label::before{content:"— "}.label::after{content:" —"}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.grid img,.row img{border:5px solid #000;border-radius:10px;display:block;background:#000}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.lobby{display:flex;flex-wrap:wrap;gap:14px;padding:18px;border-radius:12px;background:#1f1f1f;border:2px dashed #333;justify-content:center}
.pl{display:inline-flex;flex-direction:column;align-items:center}
.pl img{width:50px;height:50px;border:0!important;border-radius:5px!important;position:relative;z-index:1}
.pt{margin-top:-5px;position:relative;z-index:2;background:#eee;color:#141414;padding:5px 12px;border-radius:20px;font-size:11px;font-style:italic;font-weight:bolder;min-width:60px;text-align:center;box-shadow:0 5px 5px #000}
.pt.me{background:var(--secondary);box-shadow:0 5px 5px #000,0 0 20px var(--secondary)}
.votes{display:flex;gap:10px;flex-wrap:wrap}
.vt{width:140px;height:140px;border:5px solid #141414;border-radius:10px;background-color:#2b2b2b;background-size:cover;display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding:5px}
.vt.sel{box-shadow:0 0 20px var(--secondary)}
.vt span{background:rgba(0,0,0,.55);padding:2px 8px;border-radius:10px}
.cap{font-size:10px;color:#888;margin-top:6px;text-align:center}
details{margin-top:18px}
summary{cursor:pointer;color:var(--primary);letter-spacing:2px;font-size:12px}
.slot{margin:14px 0 6px;color:#999;font-size:11px;letter-spacing:2px}
.parts{display:flex;flex-wrap:wrap;gap:8px}
.part{width:92px;text-align:center;font-size:9px;color:#aaa}
.part img{width:92px;height:92px;border:4px solid #000;border-radius:8px;display:block;margin-bottom:4px}
</style></head><body>
<header>
  <h1>PROPOZYCJE AWATARÓW</h1>
  <div class="intro">Trzy kierunki, każdy rysowany od zera i składany z części (bez Bottts i bez zewnętrznych zasobów). Naciśnij „Losuj”, żeby zobaczyć kolejne kombinacje. Poniżej każdego kierunku widać też, jak wygląda w poczekalni, w głosowaniu i po wyrzuceniu.</div>
</header>
<main id="dirs"></main>
<script>// PROPOZYCJA A: "CIENIE" - agenci w stylu noir: ciemne sylwetki, neonowe światło krawędziowe,
// świecące oczy. Wszystko rysowane od zera, bez żadnych cudzych zasobów.
(function (root) {
    const INK = '#0a0b0e', INK2 = '#15171c', INK3 = '#242730', INK4 = '#3b3f4b', FACE = '#1b1e25', BG = '#12141a';

    const ACCENTS = {
        green: '#39e079', red: '#ff4d4d', blue: '#4fb3ff', yellow: '#ffd43b', magenta: '#ff5fd2',
        cyan: '#4ff0ff', orange: '#ff9a3d', white: '#f2f2f2', violet: '#a78bfa'
    };

    // ===== narzędzia rysunkowe =====
    const attrs = o => Object.entries(o).map(([k, v]) => ` ${k}="${v}"`).join('');
    const P = (d, fill, o = {}) => `<path d="${d}" fill="${fill}"${attrs(o)}/>`;
    const C = (cx, cy, r, fill, o = {}) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}"${attrs(o)}/>`;
    const E = (cx, cy, rx, ry, fill, o = {}) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}"${attrs(o)}/>`;
    const R = (x, y, w, h, fill, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"${attrs(o)}/>`;
    const L = (d, stroke, w, o = {}) => `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${attrs(o)}/>`;
    const mirror = svg => `<g transform="matrix(-1 0 0 1 120 0)">${svg}</g>`;
    const pair = fn => fn() + mirror(fn());

    // Odbicie ścieżki w poziomie (tylko współrzędne bezwzględne: M L H V C Q A Z)
    function flipPath(d) {
        const f = x => +(120 - x).toFixed(2);
        return d.match(/[MLHVCQSTAZ][^MLHVCQSTAZ]*/g).map(seg => {
            const cmd = seg[0];
            const nums = (seg.slice(1).match(/-?\d*\.?\d+/g) || []).map(Number);
            let out;
            if (cmd === 'H') out = nums.map(f);
            else if (cmd === 'V' || cmd === 'Z') out = nums;
            else if (cmd === 'A') {
                out = [];
                for (let i = 0; i < nums.length; i += 7) out.push(nums[i], nums[i + 1], nums[i + 2], nums[i + 3], 1 - nums[i + 4], f(nums[i + 5]), nums[i + 6]);
            } else out = nums.map((n, i) => (i % 2 === 0 ? f(n) : n));
            return cmd + out.join(' ');
        }).join('');
    }

    // Światło krawędziowe: kolorowa kopia przesunięta w lewo-górę pod ciemnym kształtem
    const rim = (d, fill, c, off = 1.5) => P(d, c, { transform: `translate(${-off} ${-off})`, opacity: .95 }) + P(d, fill);
    const rimPair = (d, fill, c, off) => rim(d, fill, c, off) + rim(flipPath(d), fill, c, off);

    // Poświata: kilka warstw o malejącej przezroczystości
    const glowDot = (cx, cy, r, c) => C(cx, cy, r + 5, c, { opacity: .13 }) + C(cx, cy, r + 2.5, c, { opacity: .26 }) + C(cx, cy, r, c) + C(cx - r * .3, cy - r * .3, r * .32, '#fff', { opacity: .85 });
    const glowLine = (d, c, w) => L(d, c, w + 7, { opacity: .12 }) + L(d, c, w + 3.5, { opacity: .25 }) + L(d, c, w);
    const glowFill = (d, c) => P(d, c, { stroke: c, 'stroke-width': 7, 'stroke-linejoin': 'round', opacity: .12 })
        + P(d, c, { stroke: c, 'stroke-width': 3.5, 'stroke-linejoin': 'round', opacity: .26 }) + P(d, c);

    const SHOULDERS = 'M4 120 C4 99 24 91 45 87 L75 87 C96 91 116 99 116 120 Z';
    const NECK = 'M49 66 H71 V90 Q60 96 49 90 Z';

    // ===== KSZTAŁT TWARZY =====
    const HEADS = {
        oval: { name: 'Owalna', d: 'M40 52 A20 24 0 1 0 80 52 A20 24 0 1 0 40 52 Z' },
        pointed: { name: 'Szpiczasta', d: 'M40 50 C40 32 49 26 60 26 C71 26 80 32 80 50 C80 62 70 74 60 82 C50 74 40 62 40 50 Z' },
        square: { name: 'Kwadratowa', d: 'M40 38 Q40 28 50 28 H70 Q80 28 80 38 V62 Q80 76 70 76 H50 Q40 76 40 62 Z' },
        round: { name: 'Okrągła', d: 'M37 54 A23 23 0 1 0 83 54 A23 23 0 1 0 37 54 Z' },
        long: { name: 'Długa', d: 'M43 50 C43 32 50 24 60 24 C70 24 77 32 77 50 C77 68 70 80 60 80 C50 80 43 68 43 50 Z' }
    };

    // ===== UBRANIE (back = pod głową, front = nad głową) =====
    const BODIES = {
        plain: { name: 'Sweter', back: () => '', front: () => '' },
        suit: {
            name: 'Garnitur',
            back: () => '',
            front: c => P('M49 87 L60 108 L71 87 Z', '#cfd3dc')
                + L('M36 92 L49 88 L60 110 L52 120', INK3, 1.6) + L('M84 92 L71 88 L60 110 L68 120', INK3, 1.6)
                + P('M56.5 88 H63.5 L62.5 93 H57.5 Z', c, { opacity: .85 }) + P('M57.5 93 H62.5 L65 111 L60 116 L55 111 Z', c)
        },
        trench: {
            name: 'Prochowiec',
            back: () => '',
            front: c => rimPair('M26 106 L31 80 L44 64 L58 90 L51 108 Z', INK2, c)
                + L('M60 104 V120', INK3, 1.6) + C(55, 112, 1.5, INK4) + C(65, 112, 1.5, INK4)
        },
        hoodie: {
            name: 'Bluza',
            back: c => rim('M33 92 C33 76 46 70 60 70 C74 70 87 76 87 92 Z', INK2, c, 1.2),
            front: c => L('M54 97 L52 113', INK4, 1.5) + L('M66 97 L68 113', INK4, 1.5) + C(52, 114, 1.8, c) + C(68, 114, 1.8, c)
        },
        turtle: {
            name: 'Golf',
            back: () => '',
            front: () => P('M45 72 H75 V92 Q60 98 45 92 Z', INK2) + L('M46 78 H74 M46 84 H74 M46 90 Q60 95 74 90', INK3, 1.3)
        },
        scarf: {
            name: 'Szalik',
            back: () => '',
            front: c => P('M38 86 Q60 100 82 86 L84 98 Q60 114 36 98 Z', c) + P('M62 98 L75 101 L72 118 L59 116 Z', c, { opacity: .85 })
                + L('M62 106 L74 108.5 M61 112 L73 114.5', INK, 1.4, { opacity: .35 })
        }
    };

    // ===== NAKRYCIE GŁOWY =====
    const GEAR = {
        fedora: {
            name: 'Kapelusz',
            front: c => rim('M21 42 C21 34 40 31 60 31 C80 31 99 34 99 42 C99 49 80 52 60 52 C40 52 21 49 21 42 Z', INK, c)
                + rim('M41 42 C39 26 47 15 60 15 C73 15 81 26 79 42 Z', INK, c)
                + P('M40.4 34 C48 37 72 37 79.6 34 L79.2 42 C72 45 48 45 40.8 42 Z', c)
                + L('M53 17 Q60 23 67 17', INK3, 1.6)
        },
        bowler: {
            name: 'Melonik',
            front: c => rim('M30 44 C30 40 45 39 60 39 C75 39 90 40 90 44 C90 49 75 51 60 51 C45 51 30 49 30 44 Z', INK, c)
                + rim('M41 44 C38 22 49 12 60 12 C71 12 82 22 79 44 Z', INK, c)
                + P('M40.4 38 C48 41 72 41 79.6 38 L79.2 44 C72 47 48 47 40.8 44 Z', c)
        },
        hood: {
            name: 'Kaptur', noHead: true,
            back: c => rim('M16 120 C14 84 26 44 46 26 C52 20 56 15 60 11 C64 15 68 20 74 26 C94 44 106 84 104 120 Z', INK, c)
                + E(60, 57, 19, 25, '#050608') + E(60, 57, 19, 25, 'none', { stroke: INK3, 'stroke-width': 1.5 })
                + L('M30 96 C30 80 34 70 40 62 M90 96 C90 80 86 70 80 62', INK2, 1.6),
            front: () => ''
        },
        cap: {
            name: 'Płaska czapka',
            front: c => rim('M37 46 C35 30 46 22 62 22 C78 22 87 32 85 46 Z', INK, c)
                + rim('M37 46 H85 C86 51 78 54 61 54 C46 54 38 52 37 46 Z', INK2, c, 1.2)
                + C(62, 22, 2.2, INK3) + L('M62 24 L62 46', INK3, 1.2)
        },
        beanie: {
            name: 'Czapka',
            front: c => rim('M40 44 C37 24 48 14 60 14 C72 14 83 24 80 44 Z', INK, c)
                + rim('M38 36 H82 V48 H38 Z', INK2, c, 1.2)
                + L('M44 37 V47 M50 37 V47 M56 37 V47 M62 37 V47 M68 37 V47 M74 37 V47', INK3, 1.2) + R(38, 41.5, 44, 2.2, c)
        },
        slick: {
            name: 'Zaczes',
            front: c => rim('M40 48 C37 30 46 20 60 20 C76 20 84 30 80 48 C77 38 70 33 58 34 C49 35 43 40 40 48 Z', INK, c)
                + L('M47 28 C56 23 68 24 75 31', INK4, 1.6)
        },
        bald: {
            name: 'Łysy',
            front: () => E(52, 36, 7, 3, '#fff', { opacity: .07 })
        },
        balaclava: {
            name: 'Kominiarka',
            front: c => rim('M37 54 C37 30 48 25 60 25 C72 25 83 30 83 54 C83 71 72 80 60 80 C48 80 37 71 37 54 Z', INK, c)
                + R(40, 49, 40, 13, FACE, { rx: 6 })
                + L('M44 30 V47 M52 27 V47 M60 26 V47 M68 27 V47 M76 30 V47 M46 64 V78 M54 66 V80 M62 66 V80 M70 66 V78', INK2, 1.2)
        }
    };

    // ===== OCZY =====
    const EYES = {
        slit: {
            name: 'Szparki',
            svg: c => pair(() => glowFill('M40 55 Q49 53 58 60 Q48 62 40 59 Z', c))
        },
        dots: { name: 'Kropki', svg: c => pair(() => glowDot(50, 56, 4.2, c)) },
        round: {
            name: 'Okrągłe',
            svg: c => pair(() => C(50, 56, 9, c, { opacity: .18 }) + C(50, 56, 7, 'none', { stroke: c, 'stroke-width': 1.8 }) + C(50, 56, 3, c))
        },
        cyclops: {
            name: 'Cyklop',
            svg: c => glowFill('M48 56 A12 7.5 0 1 0 72 56 A12 7.5 0 1 0 48 56 Z', c) + R(58.6, 49, 2.8, 14, INK, { rx: 1.4 })
        },
        cat: {
            name: 'Kocie',
            svg: c => pair(() => E(50, 56, 7, 5.5, c, { opacity: .3 }) + E(50, 56, 5.5, 4.4, c) + R(48.8, 50.5, 2.4, 11, INK, { rx: 1.2 }))
        },
        visor: {
            name: 'Wizjer',
            svg: c => P('M38 52 H82 Q85 52 85 55 V59 Q85 62 82 62 H38 Q35 62 35 59 V55 Q35 52 38 52 Z', INK)
                + glowLine('M40 57 H80', c, 3.2) + C(76, 57, 2.2, '#fff', { opacity: .9 })
        },
        shades: {
            name: 'Okulary',
            svg: c => pair(() => P('M39 52 H57 Q58 63 52 64.5 Q43 65 40 58 Z', INK) + L('M39 52 H57 Q58 63 52 64.5 Q43 65 40 58 Z', INK4, 1.4)
                + L('M43 55.5 L50 53.5 M45 60 L53 55', '#fff', 1.3, { opacity: .55 }))
                + L('M57 54 Q60 52.5 63 54', INK4, 1.6) + C(54.5, 53.4, 1.2, c)
        },
        goggles: {
            name: 'Noktowizor',
            svg: c => L('M30 56 H40 M80 56 H90', INK4, 3)
                + pair(() => C(50, 56, 10, INK3) + C(50, 56, 7.5, c, { opacity: .35 }) + C(50, 56, 7.5, 'none', { stroke: c, 'stroke-width': 1.6 }) + C(47.5, 53.5, 2, '#fff', { opacity: .9 }))
                + R(58, 54.5, 4, 3, INK3)
        },
        monocle: {
            name: 'Monokl',
            svg: c => glowDot(50, 56, 4.2, c) + C(70, 56, 8, 'none', { stroke: '#d4af37', 'stroke-width': 1.8 }) + glowDot(70, 56, 3.6, c)
                + L('M77 61 C84 70 82 82 76 92', '#d4af37', 1.1, { opacity: .8 })
        },
        patch: {
            name: 'Przepaska',
            svg: c => glowDot(50, 56, 4.2, c) + L('M38 48 L82 62', INK4, 1.6) + P('M63 50 H77.5 Q80 50 80 53 V60 Q80 64 76 64 H66 Q62 64 62 60 V53 Q62 50 63 50 Z', INK, { stroke: INK4, 'stroke-width': 1.2 })
        },
        sleepy: {
            name: 'Zmrużone',
            svg: c => pair(() => glowFill('M43 57 H57 A7 6 0 0 1 43 57 Z', c) + R(41, 54.6, 18, 2.8, INK))
        },
        wide: {
            name: 'Wielkie',
            svg: c => pair(() => C(50, 55, 8.5, c, { opacity: .2 }) + C(50, 55, 6.4, c) + C(50, 55, 2.1, INK) + C(48, 53, 1.3, '#fff'))
        },
        angry: {
            name: 'Groźne',
            svg: c => pair(() => glowDot(50, 57, 3.8, c) + L('M40 50 L58 55', INK4, 3.2) + L('M40 50 L58 55', c, 1.1, { opacity: .7 }))
        },
        dead: {
            name: 'Krzyżyki',
            svg: c => pair(() => glowLine('M44 51 L56 61 M56 51 L44 61', c, 2.4))
        }
    };

    // ===== DOLNA CZĘŚĆ TWARZY =====
    const MOUTHS = {
        none: { name: 'Brak', svg: () => '' },
        smirk: { name: 'Uśmieszek', svg: c => glowLine('M51 69 Q61 73 70 66', c, 1.6) },
        grin: {
            name: 'Szeroki uśmiech',
            svg: c => {
                let teeth = '';
                for (let i = 1; i <= 6; i++) {
                    const t = i / 7, x = 45 + 30 * t, y = 64 + 36 * t * (1 - t) / 1.0 * 0.5;
                    teeth += L(`M${x.toFixed(1)} ${(y + 0.6).toFixed(1)} V${(y - 3.4).toFixed(1)}`, c, 1.1, { opacity: .9 });
                }
                return glowLine('M45 64 Q60 79 75 64', c, 1.8) + teeth;
            }
        },
        bandana: {
            name: 'Chusta',
            svg: c => P('M40 62 Q60 70 80 62 L79 70 Q71 87 60 87 Q49 87 41 70 Z', INK3) + L('M40 62 Q60 70 80 62', c, 1.6, { opacity: .9 })
                + C(52, 74, 1.4, c, { opacity: .8 }) + C(60, 79, 1.4, c, { opacity: .8 }) + C(68, 74, 1.4, c, { opacity: .8 })
        },
        mustache: {
            name: 'Wąsy',
            svg: () => P('M60 64 C54 60 46 62 45 68 C50 66 55 67 60 68 C65 67 70 66 75 68 C74 62 66 60 60 64 Z', INK)
                + L('M47 64.6 C52 62 56 63 60 65', '#fff', 1, { opacity: .25 })
        },
        line: { name: 'Kreska', svg: () => L('M52 69 H68', INK4, 1.8) }
    };

    // ===== DODATKI =====
    const EXTRAS = {
        none: { name: 'Nic', back: () => '', front: () => '' },
        earpiece: {
            name: 'Słuchawka',
            back: () => '',
            front: c => R(78, 52, 5, 10, INK3, { rx: 2 }) + C(80.5, 55, 1.2, c) + L('M81 62 C86 72 80 82 74 90 C70 96 66 98 62 100', INK4, 1.5)
        },
        headset: {
            name: 'Zestaw',
            back: () => '',
            front: c => L('M40 58 C36 28 84 28 80 58', INK3, 3) + R(34, 54, 8, 13, INK3, { rx: 3 }) + C(38, 60.5, 1.6, c)
                + L('M38 67 C38 76 46 80 54 77', INK3, 1.6) + C(55, 77, 2.4, c)
        },
        disguise: {
            name: 'Przebranie',
            back: () => '',
            front: c => pair(() => C(50, 56, 10.5, 'none', { stroke: c, 'stroke-width': 2.4 })) + L('M60.5 55 H59.5', c, 2.4)
                + E(60, 64, 4.6, 3.6, c) + P('M60 68 C53 63 43 66 43 73 C49 70 55 71 60 72.5 C65 71 71 70 77 73 C77 66 67 63 60 68 Z', INK)
                + L('M45 69 C50 66.5 55 67 60 69', '#fff', 1, { opacity: .3 })
        },
        antenna: {
            name: 'Antena',
            back: () => '',
            front: c => L('M60 16 V6', INK4, 1.6) + glowDot(60, 5, 2.6, c)
        },
        scar: {
            name: 'Blizna',
            back: () => '',
            front: () => L('M72 38 L58 72', INK4, 1.6) + L('M69 46 L74 48 M66 54 L71 56 M63 62 L68 64', INK4, 1.2)
        },
        badge: {
            name: 'Odznaka',
            back: () => '',
            front: c => P('M34 104 L36.4 109 L41.8 109.7 L37.8 113.4 L38.9 118.7 L34 116 L29.1 118.7 L30.2 113.4 L26.2 109.7 L31.6 109 Z', c)
        }
    };

    // ===== TŁA =====
    const defsId = 'ga';
    const BGS = {
        blinds: {
            name: 'Żaluzje',
            svg: c => {
                let s = R(0, 0, 120, 120, BG);
                for (let x = 0; x < 200; x += 16) s += P(`M${x} 0 H${x + 7} L${x + 7 - 34} 120 H${x - 34} Z`, c, { opacity: .11 });
                return s;
            }
        },
        radar: {
            name: 'Radar',
            svg: c => R(0, 0, 120, 120, BG)
                + `<defs><linearGradient id="${defsId}r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c}" stop-opacity="0"/><stop offset="1" stop-color="${c}" stop-opacity=".45"/></linearGradient></defs>`
                + P('M60 60 L120 30 A67 67 0 0 1 120 90 Z', `url(#${defsId}r)`, { transform: 'rotate(-40 60 60)' })
                + C(60, 60, 22, 'none', { stroke: c, 'stroke-width': 1, opacity: .28 }) + C(60, 60, 40, 'none', { stroke: c, 'stroke-width': 1, opacity: .28 }) + C(60, 60, 58, 'none', { stroke: c, 'stroke-width': 1, opacity: .28 })
                + L('M60 0 V120 M0 60 H120', c, 1, { opacity: .2 }) + C(92, 34, 2.4, c) + C(24, 88, 2, c, { opacity: .8 })
        },

        plain: { name: 'Sweter', draw: g => { shoulders(g, 'C'); g.rect(8, 22, 1, 2, 'c'); g.rect(15, 22, 1, 2, 'c'); g.rect(3, 22, 2, 1, 'c'); g.rect(19, 22, 2, 1, 'c'); } },
        suit: {
            name: 'Garnitur',
            draw: g => {
                shoulders(g, 'c');
                g.rect(10, 20, 4, 1, 'w'); g.rect(9, 21, 6, 1, 'w'); g.rect(11, 21, 2, 3, 'a');
                g.rect(9, 22, 2, 1, 'w'); g.rect(13, 22, 2, 1, 'w'); g.rect(10, 23, 1, 1, 'C'); g.rect(13, 23, 1, 1, 'C');
                g.px(9, 20, 'k'); g.px(14, 20, 'k'); g.px(8, 21, 'C'); g.px(15, 21, 'C'); g.rect(5, 21, 2, 1, 'C'); g.rect(17, 21, 2, 1, 'C');
            }
        },
        hoodie: {
            name: 'Bluza',
            draw: g => {
                shoulders(g, 'H'); g.rect(8, 20, 8, 1, 'a'); g.rect(9, 21, 6, 1, 'a'); g.rect(10, 20, 4, 1, 'S');
                g.px(10, 22, 'w'); g.px(10, 23, 'w'); g.px(13, 22, 'w'); g.px(13, 23, 'w'); g.px(10, 21, 'A'); g.px(13, 21, 'A');
            }
        },
        scarf: {
            name: 'Szalik',
            draw: g => {
                shoulders(g, 'c'); g.rect(8, 20, 8, 2, 'a'); g.rect(8, 21, 8, 1, 'A'); g.rect(14, 22, 3, 2, 'a'); g.rect(14, 23, 3, 1, 'A'); g.rect(10, 19, 4, 1, 'a');
            }
        }
    };

    // ===== DODATKI =====
    const EXTRAS = {
        none: { name: 'Nic', draw: () => { } },
        earpiece: {
            name: 'Słuchawka',
            draw: g => { g.rect(18, 12, 1, 2, 'g'); g.px(18, 12, 'a'); g.px(19, 14, 'g'); g.px(19, 15, 'g'); g.px(19, 16, 'g'); g.px(18, 17, 'g'); g.px(18, 18, 'g'); g.px(17, 19, 'g'); }
        },
        antenna: {
            name: 'Antena',
            draw: g => { g.rect(11, 1, 2, 2, 'k'); g.rect(11, 0, 2, 1, 'a'); g.px(11, 2, 'g'); }
        },
        scar: {
            name: 'Blizna',
            draw: g => { g.px(15, 10, 'r'); g.px(15, 11, 'r'); g.px(14, 12, 'r'); g.px(14, 13, 'r'); g.px(13, 14, 'r'); g.px(16, 12, 'w'); g.px(15, 14, 'w'); }
        },
        badge: {
            name: 'Odznaka',
            draw: g => { g.px(5, 21, 'a'); g.rect(4, 22, 3, 1, 'a'); g.px(5, 23, 'a'); g.px(4, 23, 'A'); g.px(6, 23, 'A'); }
        },
        blush: {
            name: 'Rumieńce',
            draw: g => { g.rect(7, 15, 2, 1, 'a'); g.rect(15, 15, 2, 1, 'a'); }
        }
    };

    // ===== TŁA =====
    const BGS = {
        solid: { name: 'Gładkie', draw: g => g.rect(0, 0, 24, 24, '#161820') },
        dither: {
            name: 'Szachownica',
            draw: (g, pal) => { for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) g.px(x, y, (x + y) % 2 ? '#191b24' : '#14161d'); }
        },
        stripes: {
            name: 'Pasy',
            draw: (g, pal) => { for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) g.px(x, y, ((x + y) >> 2) % 2 ? shade(pal.a, .22) : shade(pal.a, .16)); }
        },
        grid: {
            name: 'Siatka',
            draw: (g, pal) => { for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) g.px(x, y, x % 4 === 0 || y % 4 === 0 ? shade(pal.a, .3) : '#12141a'); }
        },
        scan: {
            name: 'Linie',
            draw: (g, pal) => { for (let y = 0; y < 24; y++) g.rect(0, y, 24, 1, y % 2 ? '#11131a' : shade(pal.a, .18)); }
        },
        stars: {
            name: 'Gwiazdy',
            draw: (g, pal) => {
                g.rect(0, 0, 24, 24, '#0f1118');
                [[2, 3], [20, 2], [4, 14], [21, 10], [1, 20], [22, 18], [18, 5], [5, 7], [12, 1], [3, 10]].forEach(([x, y], i) => g.px(x, y, i % 3 ? G2 : pal.a));
            }
        },
        city: {
            name: 'Miasto',
            draw: (g, pal) => {
                g.rect(0, 0, 24, 24, shade(pal.a, .18));
                [[0, 12, 5], [4, 9, 5], [9, 14, 4], [14, 10, 5], [18, 13, 6]].forEach(([x, y, w]) => {
                    g.rect(x, y, w, 24 - y, '#0e1016');
                    for (let wy = y + 2; wy < 21; wy += 3) for (let wx = x + 1; wx < x + w - 1; wx += 2) if ((wx + wy) % 3) g.px(wx, wy, pal.a);
                });
                g.rect(19, 2, 3, 3, '#f4f1de');
            }
        },
        alarm: {
            name: 'Alarm',
            draw: g => { for (let y = 0; y < 24; y++) for (let x = 0; x < 24; x++) g.px(x, y, x + y < 24 ? '#4a1a22' : '#1a2f5c'); }
        }
    };

    const CATALOG = { bg: BGS, body: BODIES, head: HEADS, gear: GEAR, eyes: EYES, mouth: MOUTHS, extra: EXTRAS };
    const SLOTS = ['bg', 'body', 'head', 'gear', 'eyes', 'mouth', 'extra'];
    const PARTS = Object.fromEntries(Object.entries(CATALOG).map(([slot, items]) => [slot, Object.keys(items)]));
    PARTS.skin = Object.keys(SKINS);
    PARTS.accent = Object.keys(ACCENTS);
    const NAMES = Object.fromEntries(Object.entries(CATALOG).map(([slot, items]) => [slot, Object.fromEntries(Object.entries(items).map(([id, item]) => [id, item.name]))]));

    // ===== SKŁADANIE =====
    function render(cfg) {
        const pick = (slot, def) => CATALOG[slot][cfg[slot]] || CATALOG[slot][def];
        const skin = SKINS[cfg.skin] || SKINS.mint, accent = ACCENTS[cfg.accent] || ACCENTS.green;
        const pal = {
            k: INK, s: skin, S: shade(skin, .78), w: WH, a: accent, A: shade(accent, .62),
            d: D2, D: D1, g: G1, l: G2, r: RED,
            c: '#3b4360', C: '#566089', H: shade(accent, .5)     // ubrania: granat, jaśniejszy granat, bluza w kolorze akcentu
        };
        const g = Grid(pal);

        pick('bg', 'solid').draw(g, pal);
        pick('body', 'plain').draw(g);
        drawHead(g, pick('head', 'square'));
        pick('mouth', 'none').draw(g);
        pick('eyes', 'dots').draw(g);
        pick('gear', 'bald').draw(g);
        pick('extra', 'none').draw(g);

        return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" shape-rendering="crispEdges">${g.svg()}</svg>`;
    }

    function renderKicked(cfg) {
        return render({ ...cfg, eyes: 'dead' }).replace('<svg ', '<svg style="filter:grayscale(.85) brightness(.85)" ');
    }

    function rng(seed) {
        let s = seed >>> 0;
        return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    }
    function random(seed) {
        const r = rng(seed), pickOf = list => list[Math.floor(r() * list.length)];
        const cfg = {};
        SLOTS.forEach(slot => { cfg[slot] = pickOf(PARTS[slot].filter(id => !(slot === 'eyes' && id === 'dead'))); });
        cfg.skin = pickOf(PARTS.skin);
        cfg.accent = pickOf(PARTS.accent);
        return cfg;
    }

    const api = {
        id: 'C', title: 'Piksele', tagline: 'Pikselowi szpiedzy na siatce 24×24, w stylu czcionki Silkscreen',
        render, renderKicked, random, PARTS, NAMES, SLOTS, ACCENTS,
        base: { bg: 'grid', body: 'suit', head: 'square', gear: 'fedora', eyes: 'shades', mouth: 'line', extra: 'none', skin: 'mint', accent: 'green' }
    };
    root.GenC = api;
    if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
const GENS = [GenA, GenB, GenC];
const BLURBS = {
  A: 'Ciemne sylwetki w stylu noir z neonowym światłem krawędziowym i świecącymi oczami. Najbliżej logo gry (kapelusz, okulary, kołnierz prochowca) i klimatu „kto jest pod płaszczem?”.',
  B: 'Zamaskowane postacie: jaskrawa maska na ciemnej głowie, gruby czarny kontur jak w logo, teatralne tła. Najbardziej kreskówkowy i zabawny z tej trójki (maska-torba, kot, dziób, włamywacz).',
  C: 'Pikselowi szpiedzy na siatce 24×24, w tej samej estetyce co czcionka Silkscreen. Twarze są widoczne, nietypowe kolory skóry, bardzo lekkie pliki. Najbardziej „retro-arkadowy”.'
};
const NICKS = ['Kasia', 'Tomek', 'Ola', 'Maciek', 'Ania'];
const uri = svg => 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
const img = (svg, size) => '<img width="' + size + '" height="' + size + '" src="' + uri(svg) + '">';
const fmt = n => n >= 1e9 ? (n / 1e9).toFixed(1) + ' mld' : n >= 1e6 ? (n / 1e6).toFixed(1) + ' mln' : n >= 1e3 ? Math.round(n / 1e3) + ' tys.' : String(n);

function combos(gen) {
  return Object.entries(gen.PARTS).reduce((p, [slot, list]) => p * (slot === 'trim' && gen.PARTS.color ? list.length - 1 : list.length), 1);
}

function section(gen, seed) {
  const sections = [];
  const randoms = Array.from({ length: 18 }, (_, i) => gen.random(seed + i));
  const kickedBase = gen.random(seed + 400);
  const partsHtml = [...gen.SLOTS, ...['accent', 'skin', 'color', 'trim'].filter(s => gen.PARTS[s])].map(slot => {
    const tiles = gen.PARTS[slot].map(id => {
      const cfg = Object.assign({}, gen.base, { [slot]: id });
      const name = (gen.NAMES[slot] && gen.NAMES[slot][id]) || id;
      return '<div class="part">' + img(gen.render(cfg), 92) + name + '</div>';
    }).join('');
    return '<div class="slot">' + slot.toUpperCase() + ' (' + gen.PARTS[slot].length + ')</div><div class="parts">' + tiles + '</div>';
  }).join('');

  return '<div class="head"><div><h2>' + gen.id + ' · ' + gen.title.toUpperCase() + '</h2><div class="tag">' + BLURBS[gen.id] + '</div>'
    + '<div class="meta">' + gen.SLOTS.length + ' części + kolory · ok. ' + fmt(combos(gen)) + ' kombinacji</div></div><button data-gen="' + gen.id + '">Losuj</button></div>'
    + '<div class="label">LOSOWE AWATARY</div><div class="grid">' + randoms.map(cfg => img(gen.render(cfg), 112)).join('') + '</div>'
    + '<div class="label">W POCZEKALNI (50 PX, JAK W GRZE)</div><div class="lobby">' + NICKS.map((n, i) => '<div class="pl">' + img(gen.render(gen.random(seed + 50 + i)), 50) + '<span class="pt' + (i === 2 ? ' me' : '') + '">' + n + '</span></div>').join('') + '</div>'
    + '<div class="label">GŁOSOWANIE I WYNIKI</div><div class="row">'
    + [0, 1, 2].map(i => '<div><div class="vt' + (i === 1 ? ' sel' : '') + '" style="background-image:url(' + uri(gen.render(gen.random(seed + 70 + i))) + ')"><span>' + NICKS[i] + '</span></div></div>').join('')
    + '<div><div class="vt" style="background-image:url(' + uri(gen.render(kickedBase)) + ')"><span>żywy</span></div></div>'
    + '<div><div class="vt" style="background-image:url(' + uri(gen.renderKicked(kickedBase)) + ')"><span>wyrzucony</span></div></div></div>'
    + '<div class="label">MAŁE ROZMIARY: 40 / 50 / 70 PX</div><div class="row">'
    + [40, 40, 40, 50, 50, 50, 70, 70].map((s, i) => '<div>' + img(gen.render(gen.random(seed + 90 + i)), s) + '</div>').join('') + '</div>'
    + '<details><summary>WSZYSTKIE CZĘŚCI</summary>' + partsHtml + '</details>';
}

const root = document.getElementById('dirs');
GENS.forEach(gen => {
  const el = document.createElement('section');
  el.className = 'dir'; el.id = 'dir' + gen.id;
  el.innerHTML = section(gen, 1);
  root.appendChild(el);
});
root.addEventListener('click', e => {
  const b = e.target.closest('button[data-gen]');
  if (!b) return;
  const gen = GENS.find(g => g.id === b.dataset.gen);
  const el = document.getElementById('dir' + gen.id), open = el.querySelector('details').open;
  el.innerHTML = section(gen, Math.floor(Math.random() * 1e9));
  el.querySelector('details').open = open;
});
</script></body></html>
